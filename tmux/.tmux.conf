set -g default-terminal "tmux-256color"
set -g xterm-keys on
set -as terminal-overrides ",xterm*:Tc"
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ",xterm-ghostty:extkeys"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm*:extkeys"

# Clipboard integration. tmux-yank will use this where supported; pbcopy is used below for macOS.
set -g set-clipboard on

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind r
bind r source-file ~/.tmux.conf

unbind x
bind x kill-window

set -g mouse on

set -g mode-keys vi
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
unbind-key -T copy-mode-vi C-v
# tmux-yank also binds y, but keep an explicit macOS clipboard binding so this works even if the plugin is absent.
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy'
# Clean-copy helper is built by `make -C /Users/irwinarruda/Documents/CONFIGS/vim-config/tmux build`.
# Clean-copy the current copy-mode selection: trim right padding and remove common left whitespace gutter.
bind-key -T copy-mode-vi C-y send -X copy-pipe-and-cancel '/Users/irwinarruda/Documents/CONFIGS/vim-config/tmux/bin/clean-copy --rewrap'

# Clean-copy full pane history: join terminal-wrapped lines, trim right padding, remove common left whitespace gutter.
bind-key C-y run-shell 'tmux capture-pane -pJ -S - | /Users/irwinarruda/Documents/CONFIGS/vim-config/tmux/bin/clean-copy'

unbind -T copy-mode-vi MouseDragEnd1Pane

# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'dracula/tmux'
set -g @dracula-show-powerline true
set -g @dracula-battery-colors "dark_purple white"
set -g @dracula-weather-colors "green dark_gray"

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Shift + I to reload
run '~/.tmux/plugins/tpm/tpm'
